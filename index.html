<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111114" />
  <title>WebPad — a tiny iPad for the web</title>
  <link rel="icon" type="image/png" href="assets/icons/webpad.png" />
  <link rel="stylesheet" href="css/os.css" />
</head>
<body>
  <div id="stage">
    <div id="device">
      <div class="camera-dot"></div>
      <div id="screen" class="light-ui">
        <!-- status bar -->
        <div id="statusbar">
          <span id="sb-time">9:41</span>
          <span class="sb-right">
            <svg class="sb-icon" viewBox="0 0 16 12" width="17" height="13"><rect x="0" y="8.5" width="3" height="3.5" rx="1" fill="currentColor"/><rect x="4.3" y="6" width="3" height="6" rx="1" fill="currentColor"/><rect x="8.6" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="12.9" y="0.5" width="3" height="11.5" rx="1" fill="currentColor"/></svg>
            <span id="sb-batt">100%</span>
          </span>
        </div>

        <!-- dim overlay for brightness -->
        <div id="dim-layer"></div>

        <!-- boot screen -->
        <div id="boot-screen">
          <img src="assets/icons/webpad.png" alt="WebPad" width="96" height="96" />
          <div class="boot-bar"><div class="boot-fill"></div></div>
        </div>

        <!-- lock screen -->
        <div id="lock-screen" class="hidden">
          <div class="lock-time" id="lock-time">9:41</div>
          <div class="lock-date" id="lock-date">Tuesday, 3 November</div>
          <div class="lock-hint">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <span>Swipe up to unlock</span>
          </div>
        </div>

        <!-- home screen -->
        <div id="home-screen" class="hidden">
          <div id="icon-grid"></div>
          <div id="page-dots"><span class="dot active"></span></div>
          <div id="dock"></div>
        </div>

        <!-- app layer -->
        <div id="app-layer"></div>

        <!-- control center -->
        <div id="cc-scrim"></div>
        <div id="control-center">
          <div class="cc-grid">
            <div class="cc-card cc-main">
              <div class="cc-row">
                <button class="cc-tile" id="cc-dark" title="Dark mode">
                  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
                <button class="cc-tile" id="cc-wallpaper" title="Next wallpaper">
                  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg>
                </button>
              </div>
            </div>
            <div class="cc-card cc-slider">
              <div class="cc-slider-head">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2 12h2.5M19.5 12H22M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
                <span>Brightness</span>
              </div>
              <input type="range" id="cc-brightness" min="25" max="100" value="100" />
            </div>
          </div>
        </div>

        <!-- toast -->
        <div id="toast" class="hidden"></div>
      </div>

      <!-- home button -->
      <button id="home-btn" aria-label="Home"></button>
    </div>
  </div>

  <script src="js/os.js"></script>
</body>
</html>
